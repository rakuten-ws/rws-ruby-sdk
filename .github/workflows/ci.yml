name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version:
          - 3.2
          - 3.3
          - 3.4
          - 4.0
          - head

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_WITHOUT: vscode
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run test
        run: bundle exec rake

  rbs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_WITHOUT: vscode
        with:
          ruby-version: 4.0
          bundler-cache: true
      - name: Check generated RBS signatures are up to date
        run: bundle exec rake sig:check
      - name: Validate RBS signatures
        run: bundle exec rbs -r uri -r json -I sig validate
